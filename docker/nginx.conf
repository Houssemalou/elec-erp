upstream erp_upstream {
    server erp-admin:3001;
}

upstream shop_upstream {
    server vitrine:3000;
}

# Boutique en ligne — HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name electro-nova.tn www.electro-nova.tn;

    ssl_certificate     /etc/letsencrypt/live/electro-nova.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/electro-nova.tn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://shop_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Back-office ERP — HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name haadmin.electro-nova.tn;

    ssl_certificate     /etc/letsencrypt/live/electro-nova.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/electro-nova.tn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://erp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Redirection HTTP → HTTPS (challenge ACME conservé)
server {
    listen 80;
    server_name electro-nova.tn www.electro-nova.tn haadmin.electro-nova.tn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}